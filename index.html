<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模块截图工具</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #1A428A;
      --accent: #2563EB;
      --text: #172033;
      --muted: #64748B;
      --line: #E2E8F0;
      --soft: #F8FAFC;
      --white: #FFFFFF;
      --success: #12805C;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: #EEF2F7;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.06);
    }

    .panel-header {
      padding: 18px 18px 0;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .panel-body {
      padding: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text);
      background: white;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.6;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .field {
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .secondary {
      background: var(--soft);
      color: var(--primary);
      border: 1px solid var(--line);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .module-list {
      display: grid;
      gap: 10px;
    }

    .module {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }

    .module:hover {
      border-color: rgba(37, 99, 235, 0.45);
    }

    .module input {
      width: auto;
      margin-top: 4px;
    }

    .module-title {
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 4px;
    }

    .module-meta {
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 6px;
      background: var(--soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .status.ok {
      background: rgba(18, 128, 92, 0.08);
      color: var(--success);
    }

    .status.error {
      background: rgba(220, 38, 38, 0.08);
      color: #B91C1C;
    }

    .empty {
      padding: 34px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
      color: var(--muted);
      background: var(--soft);
    }

    .small-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 860px) {
      .app {
        padding: 18px;
      }

      .topbar,
      .layout {
        display: block;
      }

      .panel {
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <h1>模块截图工具</h1>
        <p class="hint">选择 HTML 页面，自动识别 section/footer 模块，按 H5 宽度渲染并导出 PNG。</p>
      </div>
      <button class="secondary" id="refreshFiles">刷新文件</button>
    </div>

    <div class="layout">
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">截图设置</div>
          <p class="hint">默认就是你常用的 H5 设置：430px 渲染，1420px 导出。</p>
        </div>
        <div class="panel-body">
          <div class="field">
            <label for="fileSelect">HTML 文件</label>
            <select id="fileSelect"></select>
          </div>

          <div class="grid-2">
            <div class="field">
              <label for="cssWidth">H5 渲染宽度</label>
              <input id="cssWidth" type="number" value="430" min="280" max="800">
            </div>
            <div class="field">
              <label for="outputWidth">导出图片宽度</label>
              <input id="outputWidth" type="number" value="1420" min="430" max="3000">
            </div>
          </div>

          <div class="field">
            <label for="manualSelectors">手动模块选择器</label>
            <textarea id="manualSelectors" placeholder="可选。每行一个模块，例如：
#team
#experience
.pricing-inquiry"></textarea>
            <p class="small-note">填写后会优先使用这里的选择器；不填则使用右侧勾选的模块。</p>
          </div>

          <div class="actions">
            <button class="secondary" id="detectBtn">识别模块</button>
            <button class="primary" id="captureBtn">开始截图</button>
          </div>

          <div class="status" id="status">等待操作。</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">识别到的模块</div>
          <p class="hint">勾选要截图的模块，文件名会按顺序自动编号。</p>
        </div>
        <div class="panel-body">
          <div class="actions" style="margin-bottom: 12px;">
            <button class="secondary" id="selectAll">全选</button>
            <button class="secondary" id="selectNone">取消全选</button>
          </div>
          <div id="moduleList" class="module-list">
            <div class="empty">先选择文件并点击“识别模块”。</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const fileSelect = document.querySelector('#fileSelect');
    const moduleList = document.querySelector('#moduleList');
    const statusBox = document.querySelector('#status');
    const detectBtn = document.querySelector('#detectBtn');
    const captureBtn = document.querySelector('#captureBtn');
    const manualSelectors = document.querySelector('#manualSelectors');

    let detectedSections = [];

    function setStatus(text, type = '') {
      statusBox.className = `status ${type}`;
      statusBox.textContent = text;
    }

    function setBusy(isBusy) {
      detectBtn.disabled = isBusy;
      captureBtn.disabled = isBusy;
      document.querySelector('#refreshFiles').disabled = isBusy;
    }

    async function loadFiles() {
      setStatus('正在读取 HTML 文件...');
      const response = await fetch('/api/files');
      const data = await response.json();
      fileSelect.innerHTML = data.files.map(file => `<option value="${file}">${file}</option>`).join('');
      setStatus(`已读取 ${data.files.length} 个 HTML 文件。`);
    }

    function renderModules(sections) {
      detectedSections = sections;
      if (!sections.length) {
        moduleList.innerHTML = '<div class="empty">没有识别到 section 或 footer 模块。</div>';
        return;
      }

      moduleList.innerHTML = sections.map(section => `
        <label class="module">
          <input type="checkbox" data-index="${section.index - 1}" checked>
          <div>
            <div class="module-title">${section.index}. ${escapeHtml(section.title)}</div>
            <div class="module-meta">${escapeHtml(section.selector)} · 高度 ${section.height}px</div>
          </div>
        </label>
      `).join('');
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    async function detectModules() {
      const file = fileSelect.value;
      if (!file) return;
      setBusy(true);
      setStatus('正在打开页面并识别模块...');
      try {
        const response = await fetch(`/api/detect?file=${encodeURIComponent(file)}`);
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || '识别失败');
        renderModules(data.sections);
        setStatus(`识别完成：${data.sections.length} 个模块。`, 'ok');
      } catch (error) {
        setStatus(error.message, 'error');
      } finally {
        setBusy(false);
      }
    }

    function selectedSections() {
      const manual = manualSelectors.value
        .split('\n')
        .map(line => line.trim())
        .filter(Boolean);

      if (manual.length) {
        return manual.map((selector, index) => ({
          selector,
          name: `${index + 1}`
        }));
      }

      return Array.from(moduleList.querySelectorAll('input[type="checkbox"]:checked'))
        .map(input => detectedSections[Number(input.dataset.index)])
        .filter(Boolean)
        .map(section => ({
          selector: section.selector,
          name: section.title
        }));
    }

    async function captureModules() {
      const file = fileSelect.value;
      const sections = selectedSections();
      if (!file) {
        setStatus('请先选择 HTML 文件。', 'error');
        return;
      }
      if (!sections.length) {
        setStatus('请至少勾选一个模块，或手动输入一个选择器。', 'error');
        return;
      }

      setBusy(true);
      setStatus('正在截图，页面较长时需要稍等...');
      try {
        const response = await fetch('/api/capture', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file,
            sections,
            cssWidth: Number(document.querySelector('#cssWidth').value || 430),
            outputWidth: Number(document.querySelector('#outputWidth').value || 1420)
          })
        });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || '截图失败');
        const lines = [
          `截图完成：${data.results.filter(item => !item.skipped).length} 张`,
          `保存目录：${data.outputDir}`,
          ...data.results.map(item => item.skipped ? `跳过 ${item.selector}：${item.reason}` : `${item.fileName}`)
        ];
        setStatus(lines.join('\n'), 'ok');
      } catch (error) {
        setStatus(error.message, 'error');
      } finally {
        setBusy(false);
      }
    }

    document.querySelector('#refreshFiles').addEventListener('click', loadFiles);
    detectBtn.addEventListener('click', detectModules);
    captureBtn.addEventListener('click', captureModules);
    document.querySelector('#selectAll').addEventListener('click', () => {
      moduleList.querySelectorAll('input[type="checkbox"]').forEach(input => input.checked = true);
    });
    document.querySelector('#selectNone').addEventListener('click', () => {
      moduleList.querySelectorAll('input[type="checkbox"]').forEach(input => input.checked = false);
    });
    fileSelect.addEventListener('change', () => {
      detectedSections = [];
      moduleList.innerHTML = '<div class="empty">文件已切换，点击“识别模块”。</div>';
    });

    loadFiles();
  </script>
</body>
</html>
